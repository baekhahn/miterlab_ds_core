component: Tabs
status: draft
purpose: freeze Ant Design Mobile Tabs and Tab props as the core tabs schema
props:
  activeKey: [string, null]
  defaultActiveKey: [string, null]
  activeLineMode: [auto, full, fixed]
  stretch: [false, true]
  onChange: function
  children: reactNode
  direction: [ltr, rtl]
  autoScroll: [false, true]
  --fixed-active-line-width: string
  --active-line-height: string
  --active-line-border-radius: string
  --title-font-size: string
  --content-padding: string
  --active-title-color: string
  --active-line-color: string
propDefaults:
  activeLineMode: auto
  stretch: true
  direction: ltr
tabProps:
  title: reactNode
  disabled: [false, true]
  forceRender: [false, true]
  destroyOnClose: [false, true]
  children: reactNode
variants:
  activeLineMode: [auto, full, fixed]
  direction: [ltr, rtl]
states:
  tab: [default, active, disabled]
metrics:
  tabPaddingX: 12px
  tabPaddingTop: 8px
  tabPaddingBottom: 10px
  contentPadding: 12px
  activeLineHeight: 2px
tokens:
  cssVars:
    - --fixed-active-line-width
    - --active-line-height
    - --active-line-border-radius
    - --title-font-size
    - --content-padding
    - --active-title-color
    - --active-line-color
notes:
  - activeKey and defaultActiveKey allow null in the official API
  - source schema is Ant Design Mobile TabsProps and TabProps
