component: Button
status: draft
purpose: adopt Ant Design Mobile button props directly for the core button family baseline
props:
  color: [default, primary, success, warning, danger]
  fill: [solid, outline, none]
  size: [mini, small, middle, large]
  shape: [default, rounded, rectangular]
  block: [false, true]
  loading: [false, true, auto]
  loadingText: string
  loadingIcon: reactNode
  disabled: [false, true]
  onClick: function
  type: [button, submit, reset]
  children: reactNode
  onMouseDown: function
  onMouseUp: function
  onTouchStart: function
  onTouchEnd: function
  id: string
  form: string
  className: string
  style: object
  tabIndex: number
  --text-color: string
  --background-color: string
  --border-radius: string
  --border-width: string
  --border-style: string
  --border-color: string
propDefaults:
  color: default
  fill: solid
  size: middle
  shape: default
  block: false
  loading: false
  loadingIcon: <DotLoading color='currentColor' />
  disabled: false
  type: button
states: [default, active, focus, disabled, loading]
sizeDefaults:
  mini:
    height: auto
    paddingX: 12
    paddingY: 3
    radius: 4
    radiusRectangular: 0
    iconGap: 0
  small:
    height: auto
    paddingX: 12
    paddingY: 3
    radius: 4
    radiusRectangular: 0
    iconGap: 0
  middle:
    height: auto
    paddingX: 12
    paddingY: 7
    radius: 4
    radiusRectangular: 0
    iconGap: 0
  large:
    height: auto
    paddingX: 12
    paddingY: 11
    radius: 4
    radiusRectangular: 0
    iconGap: 0
internalLayout:
  minWidth: 0
  textAlignX: center
  textAlignY: center
slots: [container, label]
tokens:
  cssVars:
    - --text-color
    - --background-color
    - --border-radius
    - --border-width
    - --border-style
    - --border-color
semanticMapping:
  solid.default:
    default:
      container.background: semantic.surface.subtle
      container.border: semantic.surface.subtle
      label.color: semantic.text.primary
    hover:
      container.background: semantic.surface.sunken
      container.border: semantic.surface.sunken
      label.color: semantic.text.primary
    pressed:
      container.background: semantic.surface.sunken
      container.border: semantic.border.strong
      label.color: semantic.text.primary
    focus:
      container.focusRing: semantic.focus.ring
    disabled:
      container.background: semantic.action.disabled
      container.border: semantic.action.disabled
      label.color: semantic.text.muted
    loading:
      container.background: semantic.surface.sunken
      container.border: semantic.surface.sunken
      label.color: semantic.text.primary
  solid.primary:
    default:
      container.background: semantic.action.primary
      container.border: semantic.action.primary
      label.color: semantic.action.onPrimary
    hover:
      container.background: semantic.action.primaryHover
      container.border: semantic.action.primaryHover
      label.color: semantic.action.onPrimary
    pressed:
