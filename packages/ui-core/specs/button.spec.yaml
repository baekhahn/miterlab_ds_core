notes:
  - official NativeProps adds className, style, tabIndex, and aria/data attributes
  - official ButtonProps does not define href, target, or icon props
  - official ButtonProps does not define htmlType; native button type is exposed as type
  - official loadingIcon default is <DotLoading color='currentColor' />
  - source schema is Ant Design Mobile ButtonProps
