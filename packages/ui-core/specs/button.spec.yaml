component: Button
status: draft
purpose: define a platform-agnostic mobile button contract
props:
  emphasis: [primary, secondary, tertiary, destructive]
  size: [sm, md, lg]
  width: [hug, full]
  state: [enabled, pressed, disabled, loading]
  label: string
  disabled: [false, true]
  loading: [false, true]
  onClick: function
  className: string
  style: object
  tabIndex: number
propDefaults:
  emphasis: primary
  size: md
  width: hug
  state: enabled
  disabled: false
  loading: false
states: [enabled, pressed, disabled, loading]
sizeDefaults:
  sm:
    height: 44
    paddingX: 14
    paddingY: 10
    radius: 14
    gap: 8
  md:
    height: 50
    paddingX: 18
    paddingY: 13
    radius: 14
    gap: 8
  lg:
    height: 56
    paddingX: 20
    paddingY: 16
    radius: 16
    gap: 8
defaults:
  minWidth: 128
  fontSize: 16
  lineHeight: 22
internalLayout:
  minWidth: 128
  textAlignX: center
  textAlignY: center
slots: [container, label]
notes:
  - primary is the highest emphasis action in a section
  - full width is used for primary bottom actions
  - loading blocks repeat tap and preserves layout
