component: Input
status: draft
purpose: freeze the core input contract to the reference InputProps surface
props:
  maxLength: number
  minLength: number
  autoComplete: string
  autoFocus: [false, true]
  pattern: string
  inputMode: string
  type: string
  name: string
  onFocus: function
  onBlur: function
  onPaste: function
  autoCapitalize: string
  autoCorrect: string
  onKeyDown: function
  onKeyUp: function
  onCompositionStart: function
  onCompositionEnd: function
  onClick: function
  step: number
  id: string
  placeholder: string
  readOnly: [false, true]
  disabled: [false, true]
  enterKeyHint: string
  value: string
  defaultValue: string
  onChange: function
  clearable: [false, true]
  clearIcon: reactNode
  onlyShowClearWhenFocus: [false, true]
  onClear: function
  onEnterPress: function
  min: number
  max: number
  role: string
  className: string
  style: object
  tabIndex: number
  --font-size: string
  --color: string
  --placeholder-color: string
  --text-align: string
propDefaults:
  autoFocus: false
  clearable: false
  clearIcon: <CloseCircleFill />
  defaultValue: ''
  disabled: false
  onlyShowClearWhenFocus: true
  readOnly: false
states: [default, focus, disabled, readOnly]
defaults:
  height: 24
  paddingX: 0
  paddingY: 0
  radius: 0
  inset: 8
  fontSize: 17
internalLayout:
  minWidth: 0
  textAlignX: start
  textAlignY: center
slots: [field, value, placeholder, action]
tokens:
  cssVars:
    - --font-size
    - --color
    - --placeholder-color
    - --text-align
semanticMapping:
  default:
    default:
      field.background: semantic.surface.default
      field.border: semantic.border.default
      value.color: semantic.text.primary
      placeholder.color: semantic.text.muted
    disabled:
      field.background: semantic.surface.subtle
      field.border: semantic.border.subtle
      value.color: semantic.text.muted
      placeholder.color: semantic.text.muted
    readOnly:
      field.background: semantic.surface.subtle
      field.border: semantic.border.default
      value.color: semantic.text.secondary
      placeholder.color: semantic.text.muted
notes:
  - NativeProps adds className, style, tabIndex, and aria/data attributes
  - Input is layout-independent and only owns the basic text-entry field
  - borders, titles, and action buttons belong to container families such as List or Form
  - InputProps uses clearable instead of allowClear
  - InputProps does not define size, status, prefix, or suffix props
  - clearIcon default is <CloseCircleFill />
