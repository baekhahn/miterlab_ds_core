component: Input
status: draft
purpose: define a platform-agnostic mobile input contract
props:
  intent: [default, error, success]
  size: [sm, md, lg]
  width: [hug, full]
  state: [enabled, focused, disabled, readonly, loading]
  label: string
  value: string
  defaultValue: string
  placeholder: string
  disabled: [false, true]
  readOnly: [false, true]
  type: string
  maxLength: number
  inputMode: string
  autoFocus: [false, true]
  onChange: function
  onFocus: function
  onBlur: function
  className: string
  style: object
  tabIndex: number
propDefaults:
  intent: default
  size: md
  width: full
  state: enabled
  autoFocus: false
  disabled: false
  readOnly: false
states: [enabled, focused, disabled, readonly, loading]
sizeDefaults:
  sm:
    height: 44
    paddingX: 14
    paddingY: 12
    radius: 14
  md:
    height: 48
    paddingX: 14
    paddingY: 14
    radius: 14
  lg:
    height: 56
    paddingX: 16
    paddingY: 16
    radius: 16
defaults:
  minWidth: 220
  fontSize: 16
  lineHeight: 22
internalLayout:
  minWidth: 220
  textAlignX: start
  textAlignY: center
slots: [field, value, placeholder]
notes:
  - placeholder is not a label
  - focused state must be visually distinct from error intent
  - readonly is different from disabled
